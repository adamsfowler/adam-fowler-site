<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adam Fowler</title>
<meta name="description" content="Adam Fowler: drawings in graphite on paper, hand cut and layered.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23ebebeb%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;1,300&display=swap">
<style>
/* Layout: the works hang on pieces of gallery wall. A near-white page holds square grey wall tiles on a 3-column grid with 8px gaps;
   the larger walls stand on a strip of concrete floor. The tiles' grey is the wall in Adam's photos, so the photos sit seamlessly on them.
   Single light look on purpose: it is a gallery wall. Jost throughout, all thin. */
:root {
  color-scheme: light;
  --page: #f8f8f7;          /* light grey around the walls, a little lighter than the wall boxes #ebebeb (Adam) */
  --wall: #ebebeb;          /* the wall in the photos, sampled */
  --ink: #2a2a28;
  --muted: #6e6e6a;
  --chip: #2a2a28; --chip-ink: #fbfbfa;
  --jost: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --edge: clamp(16px, 2.6vw, 36px);
  --gap: 3px;
  --cols: 3;
  --row: calc((100vw - 2 * var(--edge) - (var(--cols) - 1) * var(--gap)) / var(--cols));
  --floor: 16.3%;          /* where the floor starts in the wall photo */
}
html, body { height: 100%; background: var(--page); color: var(--ink); }
body { font-family: var(--jost); font-weight: 300; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
p { margin: 0; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-block: calc(var(--edge) + 4px) 0; padding-left: max(var(--edge), env(safe-area-inset-left, 0px)); padding-right: max(var(--edge), env(safe-area-inset-right, 0px)); height: 92px; box-sizing: border-box; font-size: 16px; }
.top nav { display: flex; gap: 22px; }
.top { background: transparent; align-items: center; height: auto; padding: 8px 0 18px; margin: var(--edge) max(var(--edge), env(safe-area-inset-right, 0px)) 0 max(var(--edge), env(safe-area-inset-left, 0px)); }  /* the name on a band of wall the width of the works, one thin gap above them */
.top > a:first-child { color: #85857f; font-weight: 200; font-size: clamp(32px, 3.6vw, 60px); line-height: .95; letter-spacing: -.01em; padding-block: 6px 10px; }
.top { align-items: flex-end; }
.top nav { padding-bottom: 12px; }
.top + main > .grid.works { padding-top: 0; }   /* the name's band runs straight into the works, no line between */
.top nav a { color: #85857f; font-size: 14px; }  /* Drawings and Bio in the same grey as the name */
.top nav a[aria-current] { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
@media (hover: hover) { body:has(.top a:hover) .top a:not(:hover) { opacity: .2; } .top a { transition: opacity .3s; } }

/* the wall grid */
.grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--gap); padding-block: 36px 120px; padding-left: max(var(--edge), env(safe-area-inset-left, 0px)); padding-right: max(var(--edge), env(safe-area-inset-right, 0px)); }
.t { position: relative; background: var(--wall); overflow: hidden; display: block; }
.fl { position: absolute; inset: 0; background: var(--wall) url("wall-floor.jpg") center bottom / cover; }  /* Adam's photo of the gallery wall and concrete floor */
.t .pic { position: absolute; inset: 0; overflow: hidden; }
.grid > .grow { overflow: visible; }
/* the title sits on the wall to the right of the work, never over it; it is counter-scaled so it reads at normal size while the box is enlarged */
.grow .cap { left: calc(100% + 18px); top: 3%; bottom: auto; white-space: nowrap; transform-origin: left top; transform: scale(calc(1 / var(--grow, 2))); transition: opacity .35s .3s; }
/* the works on a free-form grid (as on the Dutton page): three columns, some works on double tiles, the same thin gap everywhere */
.grid.works { --cols: 2; --row: calc((100vw - 2 * var(--edge) - var(--gap)) / 2); grid-auto-flow: dense; }
.grid.works > .wide { grid-column: 1 / -1; grid-row: span 2; }   /* a work given the full width of the page */  /* a plain grid: two equal square boxes across, the same thin gap everywhere */
.grid > .big { overflow: visible; }
.big .pic { position: absolute; inset: 0; overflow: hidden; background: var(--wall); }
/* the title appears on hover just below the box, on its own strip of wall, so the gaps between works stay even */
.big .cap { left: 0; right: 0; top: 100%; bottom: auto; padding: 10px 12px 12px; background: var(--wall); z-index: 1; }
@media (hover: hover) and (min-width: 761px) and (prefers-reduced-motion: no-preference) {
  .grid > .big { transition: transform 1.6s cubic-bezier(.45, 0, .2, 1), box-shadow 1.6s cubic-bezier(.45, 0, .2, 1); transform-origin: var(--o, center) top; }  /* slow and soft: eases in, glides, settles */
  .grid > .big .cap { transition: opacity .6s ease .2s; }
  .grid > .big:hover .cap, .grid > .big:focus-visible .cap { transition: opacity .8s ease .9s; }
  .grid > .big:hover, .grid > .big:focus-visible { transform: scale(var(--g)); z-index: 5; box-shadow: 0 20px 60px rgba(30, 30, 25, .14); }
  .grid > .big .cap { transform-origin: left top; transform: scale(calc(1 / var(--g))); right: auto; width: calc(100% * var(--g)); box-sizing: border-box; box-shadow: 0 20px 40px rgba(30, 30, 25, .1); }
}
.t img.ph { position: absolute; left: 50.5%; top: 48%; width: 84%; height: 84%; max-width: none; translate: -50% -50%; object-fit: contain; }  /* frame fills most of the tile */
.cap { position: absolute; left: 16px; bottom: 14px; font-size: 14px; line-height: 1.35; opacity: 0; transition: opacity .35s; pointer-events: none; }
.cap span { color: var(--muted); }
.t:hover .cap, .t:focus-visible .cap, .hung a:hover .cap, .hung a:focus-visible .cap { opacity: 1; }
@media (hover: none) { .cap { opacity: 1; } }
/* phones and touch screens: the title goes under the work's box */
@media (hover: none) and (min-width: 761px) { .big .cap { display: none; } }
@media (max-width: 760px) {
  .grid > .grow, .grid > .big { aspect-ratio: auto !important; display: flex; flex-direction: column; }
  .grow .pic, .big .pic { position: relative; inset: auto; aspect-ratio: 1 / 1; }
  .grow .cap, .big .cap { position: static; transform: none; top: auto; white-space: normal; opacity: 1; padding: 10px 16px 14px; }
}

/* resting on a work's box enlarges it out over the wall beside it */
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .grid > .grow { transition: transform .7s cubic-bezier(.2, .7, .2, 1), box-shadow .7s; will-change: transform; }
  .grid > .grow-down { transform-origin: left top; }
  .grid > .grow-up { transform-origin: left bottom; }
  .grid > .grow:hover, .grid > .grow:focus-visible { transform: scale(var(--grow, 2)); z-index: 5; box-shadow: 0 20px 60px rgba(30, 30, 25, .14); }
}

/* the artist's wall: text on wall, standing on the floor */
.wt .txt { position: absolute; left: 9%; top: 50%; translate: 0 -54%; max-width: 30rem; display: grid; gap: 14px; padding-right: 24px; }
.wt h1 { font-weight: 200; font-size: clamp(30px, 2.8vw, 40px); line-height: 1.1; margin: 0; }
.wt .dt { color: var(--muted); font-size: 14px; margin-top: -6px; }
.wt .b { font-size: 15px; line-height: 1.6; color: #45453f; }

/* the long wall: both drawings hung side by side above the floor, at eye level */
.hung { position: relative; }
.grid > .hung { aspect-ratio: 2.4; }
.grid.works + .grid { grid-auto-rows: auto; }
.hung a { position: absolute; translate: 0 -50%; }
.hung a .crop { position: absolute; inset: 0; overflow: hidden; }  /* just the frame and its shadow, cut from the wall photo */
.hung a img { position: absolute; width: 121.95%; height: 111.1%; left: -11%; top: -8.9%; max-width: none; display: block; }
.hung a .cap { left: 12%; bottom: -8%; translate: 0 100%; }
.hung .wl { position: absolute; left: 3%; top: 4%; font-size: 13px; color: var(--muted); }

@media (max-width: 760px) {
  :root { --cols: 1; }
  .grid.works { --cols: 1; }
  .grid { grid-auto-rows: auto; padding-top: 12px; }
  .grid > .t { aspect-ratio: 1 / 1; grid-area: auto !important; }
  .grid > .wt { aspect-ratio: auto; order: -1; }
  .wt .fl { display: none; }
  .wt .txt { position: static; translate: none; max-width: none; padding: 28px 7% 32px; }
  .grid > .hung { aspect-ratio: 2.4; }
}

/* ---------- the artwork view: the work on its own wall, details beside it ---------- */
.vw { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; height: calc(100% - 92px); box-sizing: border-box; padding-block: 36px var(--edge); padding-left: max(var(--edge), env(safe-area-inset-left, 0px)); padding-right: max(var(--edge), env(safe-area-inset-right, 0px)); }
.panel { position: relative; background: var(--wall); min-height: 0; min-width: 0; }
.slot { position: absolute; inset: 3% 4%; display: grid; place-items: center; }
.info { align-self: end; display: grid; gap: 4px; padding-bottom: 4px; }
.info .t1 { font-weight: 200; font-size: 28px; line-height: 1.2; margin-bottom: 6px; }
.info .m { color: var(--muted); font-size: 15px; }
.info .pager { display: flex; gap: 18px; margin-top: 22px; font-size: 15px; }
.info .pager a:hover, .info .all:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.info .pager .c { color: var(--muted); font-variant-numeric: tabular-nums; }
.info .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
.info .all { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-top: 26px; }
@media (max-width: 860px) {
  .vw { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 18px; padding-top: 8px; }
  .info .pager { margin-top: 12px; }
  .info .all { margin-top: 12px; }
}

/* viewer internals */
#site { min-height: 100%; }
#site.is-work { height: 100%; }
.hold { position: relative; line-height: 0; touch-action: none; }
.hold img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.hold.tiles img { visibility: hidden; }        /* standing back: the sharp photo itself; moving closer: the zoom tiles, which line up with it exactly */
.hold:not(.tiles) .walk { visibility: hidden; }
.walk { position: absolute !important; inset: 0; }
.walk.open { position: fixed !important; inset: auto; z-index: 15; pointer-events: none; }
.stepback { position: fixed; z-index: 21; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--chip); color: var(--chip-ink); border: 0; cursor: pointer; font: 300 14px/1 var(--jost); padding: 11px 16px; }
.fx { position: fixed; inset: 0; z-index: 16; pointer-events: none; overflow: hidden; }
/* moving between the grid and a work's page: the work itself travels, on its piece of wall */
.fly { position: fixed; z-index: 30; overflow: hidden; background: var(--wall); pointer-events: none; will-change: left, top, width, height; }
.fly img { position: absolute; max-width: none; display: block; }
.icover { position: fixed; inset: 0; z-index: 14; background: #ebebeb; }
#site.fading { transition: opacity .32s ease; }
/* one-page version (#one): resting on a work opens it to the whole window, right there; walk closer works as on a work page */
#site.one .grid > .big { transform: none !important; box-shadow: none !important; cursor: zoom-in; }
/* the magnifier: a thin ring that inverts whatever it passes over; + to open a work, − to step back out. It tightens as you walk closer */
@media (hover: hover) and (pointer: fine) {
  #site.one .grid > .big, .stage.lensing, .stage.lensing .sslot, .stage.lensing .sslot * { cursor: none !important; }
}
/* clear controls: an Enlarge tag on each work in the grid; Zoom − / + and Close under an opened work */
.big .enl { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1; padding: 8px 12px 8px 10px; background: rgba(251, 251, 250, .9); color: var(--ink, #2b2b28); opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.big .enl i { position: relative; width: 9px; height: 9px; }
.big .enl i::before, .big .enl i::after { content: ""; position: absolute; background: currentColor; }
.big .enl i::before { left: 0; right: 0; top: 4px; height: 1px; }
.big .enl i::after { top: 0; bottom: 0; left: 4px; width: 1px; }
.big:hover .enl, .big:focus-visible .enl { opacity: 1; }
@media (hover: none) { .big .enl { opacity: 1; } }
.stage .zoomer { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; display: flex; align-items: center; gap: 4px; z-index: 30; }
.stage .zb { width: 40px; height: 40px; border: 1px solid rgba(43, 43, 40, .35); background: rgba(251, 251, 250, .92); color: inherit; font: 200 22px/1 var(--jost); cursor: pointer; display: grid; place-items: center; padding: 0 0 2px; transition: background-color .3s, border-color .3s, opacity .3s; }
.stage .zb:hover { background: #fff; border-color: rgba(43, 43, 40, .7); }
.stage .zb:disabled { opacity: .3; cursor: default; }
.stage .zl { font-size: 13px; color: var(--muted); padding: 0 10px; }
.stage .shut { z-index: 30; }
.stage .zoomer > span { display: none; align-items: center; }
.stage .sbar { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--wall); z-index: 29; }   /* the controls keep a strip of wall of their own, so they stay readable over a close-up */
.stage[data-zc="buttons"] .v-buttons, .stage[data-zc="words"] .v-words, .stage[data-zc="line"] .v-line, .stage[data-zc="ruler"] .v-ruler, .stage[data-zc="steps"] .v-steps { display: flex; }
.stage .v-edge, .stage .v-hair { display: none; }
.stage[data-zc="edge"] .v-edge, .stage[data-zc="hair"] .v-hair { display: block; }
/* Words: just two quiet words, like the rest of the type */
.stage .zw { background: none; border: 0; padding: 8px 4px; font: 300 15px/1 var(--jost); color: inherit; cursor: pointer; text-underline-offset: 6px; text-decoration-thickness: 1px; transition: opacity .3s; }
.stage .zw:hover { text-decoration: underline; }
.stage .zw:disabled { opacity: .25; cursor: default; text-decoration: none; }
.stage .zdot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5; margin: 0 16px; }
/* Distance line: a hairline from far to near; the dot is where you stand. Click or drag along it */
.stage .v-line { gap: 14px; }
.stage .zt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stage .track { position: relative; width: 220px; height: 28px; cursor: pointer; touch-action: none; }
.stage .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(43, 43, 40, .3); }
.stage .fillr { position: absolute; left: 0; top: 50%; height: 1px; width: calc(var(--z, 0) * 100%); background: rgba(43, 43, 40, .9); transition: width .6s cubic-bezier(.3, 0, .2, 1); }
.stage .knob { position: absolute; top: 50%; left: calc(var(--z, 0) * 100%); width: 11px; height: 11px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--paper, #fbfbfa); border: 1px solid rgba(43, 43, 40, .9); transition: left .6s cubic-bezier(.3, 0, .2, 1), transform .3s; }
.stage .track:hover .knob { transform: scale(1.25); }
.stage .zpick { position: absolute; top: 18px; right: max(28px, env(safe-area-inset-right, 0px)); z-index: 30; display: flex; gap: 14px; align-items: baseline; font-size: 12px; color: var(--muted); background: rgba(251, 251, 250, .85); padding: 6px 10px; }
.stage .zpick button { background: none; border: 0; padding: 0; font: 300 13px/1 var(--jost); color: var(--ink, #2b2b28); cursor: pointer; }
.stage .zpick button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
/* Ruler: a measuring line with fine ticks; the dot carries how far you are standing from the work */
.stage .ruler { width: 340px; height: 34px; }
.stage .ruler .ticks { position: absolute; left: 0; right: 0; top: calc(50% - 3px); height: 6px; background: repeating-linear-gradient(90deg, rgba(43, 43, 40, .45) 0 1px, transparent 1px calc(100% / 20)); }
.stage .ruler .ticks::after { content: ""; position: absolute; inset: -3px 0; background: repeating-linear-gradient(90deg, rgba(43, 43, 40, .7) 0 1px, transparent 1px calc(100% / 4)); clip-path: inset(0 -1px 0 0); }
.stage .read { position: absolute; top: -14px; left: calc(var(--z, 0) * 100%); translate: -50% 0; font-size: 12px; white-space: nowrap; color: var(--ink, #2b2b28); transition: left .6s cubic-bezier(.3, 0, .2, 1); pointer-events: none; }
/* Steps: five places to stand, from the back of the room to nose to the paper */
.stage .steps { display: flex; gap: 20px; margin: 0 14px; }
.stage .steps button { width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(43, 43, 40, .8); background: transparent; padding: 0; cursor: pointer; transition: background-color .4s, transform .3s; }
.stage .steps button:hover { transform: scale(1.35); }
.stage .steps button.here { background: rgba(43, 43, 40, .85); }
/* Edge: a tall hairline up the right side on its own narrow band of wall; walking closer moves the dot up */
.stage .v-edge { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); top: 50%; translate: 0 -50%; height: 52vh; width: 52px; z-index: 30; background: rgba(235, 235, 235, .9); padding: 34px 0; box-sizing: content-box; }
.stage .edge { position: absolute; left: 50%; top: 34px; bottom: 34px; width: 28px; translate: -50% 0; height: auto; }
.stage .edge::before { left: 50%; right: auto; top: 0; bottom: 0; width: 1px; height: auto; background: rgba(43, 43, 40, .35); }
.stage .edge .knob { left: 50%; top: calc((1 - var(--z, 0)) * 100%); margin: -6px 0 0 -6px; transition: top .6s cubic-bezier(.3, 0, .2, 1), transform .3s; }
.stage .v-edge .zt { position: absolute; left: 50%; translate: -50% 0; top: 10px; }
.stage .v-edge .zt.far { top: auto; bottom: 10px; }
/* Horizon: one hairline across the whole width, along the top of the bottom strip of wall; the distance rides beside the dot */
.stage .v-hair { position: absolute; left: max(28px, env(safe-area-inset-left, 0px)); right: max(28px, env(safe-area-inset-right, 0px)); bottom: 46px; height: 22px; z-index: 30; }
.stage .hair { position: absolute; inset: 0; width: auto; height: auto; }
.stage .hair .read { top: 50%; translate: 12px -55%; }

.stage .scap { z-index: 30; }
.lens { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .35s ease; mix-blend-mode: difference; --d: 38px; }
.lens.on { opacity: 1; }
.lens i { position: absolute; left: calc(var(--d) / -2); top: calc(var(--d) / -2); width: var(--d); height: var(--d); box-sizing: border-box; border: 1px solid #fff; border-radius: 50%; transition: width .5s cubic-bezier(.3, 0, .2, 1), height .5s cubic-bezier(.3, 0, .2, 1), left .5s cubic-bezier(.3, 0, .2, 1), top .5s cubic-bezier(.3, 0, .2, 1); }
.lens i::before, .lens i::after { content: ""; position: absolute; left: 50%; top: 50%; background: #fff; transition: transform .4s ease, opacity .4s ease; }
.lens i::before { width: 9px; height: 1px; margin: 0 0 0 -4.5px; }
.lens i::after { width: 1px; height: 9px; margin: -4.5px 0 0; }
.lens.out i::after { transform: scaleY(0); opacity: 0; }                 /* + becomes − */
/* once you are closer, the circle gains four small arrows: drag to move the work around (Adam) */
.lens b { position: absolute; left: -29px; top: -29px; width: 58px; height: 58px; opacity: 0; transition: opacity .4s ease, transform .3s cubic-bezier(.3, 0, .2, 1); }
.lens b svg { display: block; width: 100%; height: 100%; overflow: visible; }
.lens.move b { opacity: 1; }
.lens.move i { opacity: 0; }   /* closer: the chosen cursor below replaces the plain circle */
.lens i { transition: opacity .4s ease, width .5s cubic-bezier(.3, 0, .2, 1), height .5s cubic-bezier(.3, 0, .2, 1), left .5s cubic-bezier(.3, 0, .2, 1), top .5s cubic-bezier(.3, 0, .2, 1); }
.lens.native { opacity: 0 !important; }
.lens.move.solid { mix-blend-mode: normal; }   /* the move cursor keeps its own colours so it reads over any drawing */
.cpick button { background: #8a8a85; }
.cpick button[aria-pressed="true"] { outline: 1px solid var(--ink); outline-offset: 2px; }
.stage.lensing.curhand, .stage.lensing.curhand .sslot, .stage.lensing.curhand .sslot * { cursor: grab !important; }
.stage.lensing.curhand.dragging, .stage.lensing.curhand.dragging .sslot, .stage.lensing.curhand.dragging .sslot * { cursor: grabbing !important; }
/* cursor options, to compare (temporary) */
.cpick { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; z-index: 31; display: flex; align-items: center; gap: 4px; font: 300 12px/1 var(--jost); color: var(--muted); }
.cpick > span { margin-right: 8px; white-space: nowrap; }
.cpick button { width: 34px; height: 34px; padding: 0; border: 1px solid transparent; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; position: relative; }
.cpick button svg { width: 30px; height: 30px; overflow: visible; }
.cpick button em { position: absolute; top: -13px; left: 0; right: 0; font: 300 10px/1 var(--jost); font-style: normal; color: var(--muted); }
.cpick button[aria-pressed="true"] { border-color: rgba(43, 43, 40, .45); }
@media (max-width: 900px) { .cpick { bottom: 70px; } .cpick > span { display: none; } }   /* narrower windows: the options sit just above the caption */
@media (hover: none) { .cpick { display: none; } }
.lens.grab b { transform: scale(.84); }
.lens.max i::before, .lens.max i::after { opacity: 0; }
.stage { touch-action: none; }
.lensnote { position: fixed; left: 0; top: 0; z-index: 41; pointer-events: none; font: 300 12px/16px var(--jost); color: var(--ink, #2b2b28); background: rgba(235, 235, 235, .92); padding: 5px 9px 6px; white-space: nowrap; opacity: 0; transition: opacity .5s ease; }
.lensnote.say { opacity: 1; }
/* the work's details fade in on the wall below the work when you hover; never over the drawing */
